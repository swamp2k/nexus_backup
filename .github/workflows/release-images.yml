name: Publish release images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Prerelease image version, e.g. 0.8.0-rc.1"
        required: true
        type: string
      expected_sha:
        description: "Exact 40-character main commit SHA to publish"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: bash .github/scripts/resolve-release-version.sh

  publish:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/swamp2k/nexus-backup
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Nexus Backup appliance
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXUS_BACKUP_VERSION=${{ needs.version.outputs.version }}
            NEXUS_BACKUP_REVISION=${{ github.sha }}

      - name: Record immutable acceptance identity
        shell: bash
        run: |
          {
            echo "### Nexus Backup appliance"
            echo "- tag: \`${{ needs.version.outputs.version }}\`"
            echo "- source: \`${GITHUB_SHA}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  workstation:
    if: github.event_name == 'push'
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/workstation-agent/go.mod
          cache-dependency-path: apps/workstation-agent/go.mod
      - name: Test workstation agent
        working-directory: apps/workstation-agent
        run: go test ./...
      - name: Build Windows workstation agent
        working-directory: apps/workstation-agent
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p ../../dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-X main.version=$VERSION -s -w" -o ../../dist/nexus-backup-workstation-windows-amd64.exe .
          cd ../../dist
          sha256sum nexus-backup-workstation-windows-amd64.exe > nexus-backup-workstation-windows-amd64.exe.sha256
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ needs.version.outputs.stable != 'true' }}
          generate_release_notes: true
          files: |
            dist/nexus-backup-workstation-windows-amd64.exe
            dist/nexus-backup-workstation-windows-amd64.exe.sha256
