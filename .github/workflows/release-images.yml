name: Publish release images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be SemVer, for example v0.7.0 or v0.7.0-rc.1" >&2
            exit 1
          fi
          stable=true
          if [[ "$version" == *-* ]]; then stable=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control
            image: ghcr.io/swamp2k/nexus-backup-control
            dockerfile: Dockerfile.local
          - name: agent
            image: ghcr.io/swamp2k/nexus-backup-agent
            dockerfile: Dockerfile.agent
          - name: repository
            image: ghcr.io/swamp2k/nexus-backup-repository
            dockerfile: Dockerfile.repository
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXUS_BACKUP_VERSION=${{ needs.version.outputs.version }}
            NEXUS_BACKUP_REVISION=${{ github.sha }}

  workstation:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/workstation-agent/go.mod
          cache-dependency-path: apps/workstation-agent/go.mod
      - name: Test workstation agent
        working-directory: apps/workstation-agent
        run: go test ./...
      - name: Build Windows workstation agent
        working-directory: apps/workstation-agent
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p ../../dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-X main.version=$VERSION -s -w" -o ../../dist/nexus-backup-workstation-windows-amd64.exe .
          cd ../../dist
          sha256sum nexus-backup-workstation-windows-amd64.exe > nexus-backup-workstation-windows-amd64.exe.sha256
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ needs.version.outputs.stable != 'true' }}
          generate_release_notes: true
          files: |
            dist/nexus-backup-workstation-windows-amd64.exe
            dist/nexus-backup-workstation-windows-amd64.exe.sha256
