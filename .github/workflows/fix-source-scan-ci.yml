name: Fix source scan CI

on:
  push:
    branches:
      - feature/workstation-source-scan-device-delete

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 .github/scripts/fix-source-scan-ci.py
      - name: Remove one-shot helper files
        run: |
          rm .github/scripts/fix-source-scan-ci.py
          rm .github/workflows/fix-source-scan-ci.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix workstation source scan polling and bounds"
          git push
