name: Fix source scan repository status
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/workstation-source-scan-device-delete
      - name: Patch workstation backup status semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/local-server/lib/workstations.mjs')
          s=p.read_text()
          old="""    if (operation === \"backup\") {\n      const snapshotId = state === \"completed\" && resultValue && typeof resultValue.snapshotId === \"string\" ? resultValue.snapshotId.slice(0, 128) : null;\n      const successAt = state === \"completed\" ? at.toISOString() : null;\n      await db.prepare(`\n        INSERT INTO workstation_status(device_id,repository_configured,agent_state,current_run_id,last_backup_at,last_success_at,last_snapshot_id,last_error,updated_at)\n        VALUES(?,0,'idle',NULL,?,?,?,?,?)\n        ON CONFLICT(device_id) DO UPDATE SET agent_state='idle',current_run_id=NULL,last_backup_at=excluded.last_backup_at,\n          last_success_at=COALESCE(excluded.last_success_at,workstation_status.last_success_at),\n          last_snapshot_id=COALESCE(excluded.last_snapshot_id,workstation_status.last_snapshot_id),last_error=excluded.last_error,updated_at=excluded.updated_at\n      `).bind(device.id, at.toISOString(), successAt, snapshotId, errorMessage, at.toISOString()).run();\n"""
          new="""    if (operation === \"backup\") {\n      const snapshotId = state === \"completed\" && resultValue && typeof resultValue.snapshotId === \"string\" ? resultValue.snapshotId.slice(0, 128) : null;\n      const successAt = state === \"completed\" ? at.toISOString() : null;\n      const repositoryConfiguredByRun = state === \"completed\" || state === \"partial\" ? 1 : 0;\n      await db.prepare(`\n        INSERT INTO workstation_status(device_id,repository_configured,agent_state,current_run_id,last_backup_at,last_success_at,last_snapshot_id,last_error,updated_at)\n        VALUES(?,?,'idle',NULL,?,?,?,?,?)\n        ON CONFLICT(device_id) DO UPDATE SET repository_configured=CASE WHEN excluded.repository_configured=1 THEN 1 ELSE workstation_status.repository_configured END,\n          agent_state='idle',current_run_id=NULL,last_backup_at=excluded.last_backup_at,\n          last_success_at=COALESCE(excluded.last_success_at,workstation_status.last_success_at),\n          last_snapshot_id=COALESCE(excluded.last_snapshot_id,workstation_status.last_snapshot_id),last_error=excluded.last_error,updated_at=excluded.updated_at\n      `).bind(device.id, repositoryConfiguredByRun, at.toISOString(), successAt, snapshotId, errorMessage, at.toISOString()).run();\n"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Add regression assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/local-server/test/workstation-failure-history.test.mjs')
          s=p.read_text()
          needle='''    assert.ok(successAt);\n\n    f.setNow("2026-09-13T12:05:00.000Z");'''
          repl='''    assert.ok(successAt);\n    assert.equal(afterSuccess.status.repositoryConfigured, true, "a successful backup proves repository configuration");\n\n    f.setNow("2026-09-13T12:05:00.000Z");'''
          if needle not in s:
              raise SystemExit('test target not found')
          p.write_text(s.replace(needle,repl))
          PY
      - name: Test
        run: npm ci && npm test
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/local-server/lib/workstations.mjs apps/local-server/test/workstation-failure-history.test.mjs
          git commit -m 'Preserve repository readiness after successful backup'
          git push origin HEAD:feature/workstation-source-scan-device-delete
