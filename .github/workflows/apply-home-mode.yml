name: Apply Home mode refactor
on:
  push:
    branches: [home-mode-simplification]
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: home-mode-simplification
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/workstation-agent/go.mod
          cache-dependency-path: apps/workstation-agent/go.mod
      - name: Apply refactor
        run: |
          python3 .github/scripts/apply-home-mode.py
          python3 .github/scripts/post-home-mode.py
      - name: Test Node code
        run: npm ci && npm test && npm run typecheck
      - name: Test workstation agent
        working-directory: apps/workstation-agent
        run: go test ./... && go vet ./...
      - name: Parse installer
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw apps/local-server/web/install.ps1)) | Out-Null'
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f apps/agent/tsconfig.tsbuildinfo apps/control-plane/tsconfig.tsbuildinfo packages/core/tsconfig.tsbuildinfo
          git add apps repository compose.yaml unraid
          git commit -m 'Make Home mode the zero-credential default'
          git push origin HEAD:home-mode-simplification
