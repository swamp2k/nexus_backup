name: Apply source scan + device delete

on:
  push:
    branches:
      - feature/workstation-source-scan-device-delete

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply implementation edits
        run: python3 .github/scripts/apply-source-scan-device-delete.py
      - name: Remove one-shot helper files
        run: |
          rm .github/scripts/apply-source-scan-device-delete.py
          rm .github/workflows/apply-source-scan-device-delete.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add workstation source scans and device deletion"
          git push
