name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/workstation-agent/go.mod
          cache-dependency-path: apps/workstation-agent/go.mod
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Test workstation agent
        working-directory: apps/workstation-agent
        run: go test ./...
      - name: Vet workstation agent
        working-directory: apps/workstation-agent
        run: go vet ./...
      - name: Cross-build Windows workstation agent
        working-directory: apps/workstation-agent
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-X main.version=0.0.0-ci -s -w" -o /tmp/nexus-backup-workstation-windows-amd64.exe .
      - name: Parse workstation installer
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw apps/local-server/web/install.ps1)) | Out-Null'
      - name: Validate flat-file installer contract
        shell: bash
        run: |
          set -euo pipefail
          installer=apps/local-server/web/install.ps1
          gateway=apps/local-server/bin/gateway.mjs
          grep -F '$serverUrl/workstation/nexus-backup-workstation-windows-amd64.exe' "$installer"
          grep -F '$serverUrl/workstation/nexus-backup-workstation-windows-amd64.exe.sha256' "$installer"
          grep -F '/v1/device/workstation/repository-profile' "$installer"
          grep -F 'repositoryId=' "$installer"
          if grep -Eiq 'receiverProtocol|receiverHost|receiverPort|receiverUsername|receiverPassword' "$installer"; then
            echo 'workstation installer contains unused receiver transport configuration' >&2
            exit 1
          fi
          grep -F '["/workstation/nexus-backup-workstation-windows-amd64.exe"' "$gateway"
          grep -F '["/workstation/nexus-backup-workstation-windows-amd64.exe.sha256"' "$gateway"
          grep -F 'path === "/v1/device/workstation/repository-profile"' "$gateway"
          if grep -Eiq 'restic|rest-server|insecureNoPassword|NEXUS_BACKUP_REST_|NEXUS_BACKUP_REPOSITORY_CA_' "$installer"; then
            echo 'flat-file installer contains retired legacy contracts' >&2
            exit 1
          fi
      - name: Validate one-app Unraid template
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = sorted(Path("unraid/templates").glob("*.xml"))
          assert [p.name for p in files] == ["nexus-backup.xml"], files
          root = ET.parse(files[0]).getroot()
          assert root.tag == "Container" and root.attrib.get("version") == "2"
          assert root.findtext("Name") == "NexusBackup"
          assert root.findtext("Network") == "host"
          assert root.findtext("Privileged") == "false"
          configs = {item.attrib["Target"]: item.attrib for item in root.findall("Config")}
          assert configs["/config"]["Default"] == "/mnt/user/appdata/nexus-backup"
          assert configs["/backup"]["Default"] == "/mnt/user/backups/nexus-backup"
          assert configs["/data"]["Mode"] == "ro"
          assert configs["/restore"]["Mode"] == "rw"
          print("flat-file Unraid template is well formed")
          PY

  workstation-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/workstation-agent/go.mod
          cache-dependency-path: apps/workstation-agent/go.mod
      - name: Test workstation agent on Windows
        working-directory: apps/workstation-agent
        run: go test ./...
      - name: Vet workstation agent on Windows
        working-directory: apps/workstation-agent
        run: go vet ./...
      - name: Cross-build workstation agent
        working-directory: apps/workstation-agent
        run: $env:CGO_ENABLED='0'; go build -trimpath -ldflags='-s -w' -o $env:RUNNER_TEMP\nexus-backup-workstation.exe .

  images:
    runs-on: ubuntu-latest
    needs: [test, workstation-windows]
    env:
      CI_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build flat-file appliance image
        run: docker build -f Dockerfile --build-arg NEXUS_BACKUP_VERSION="$CI_VERSION" --build-arg NEXUS_BACKUP_REVISION="$GITHUB_SHA" -t nexus-backup:ci .
      - name: Verify bundled flat-file assets
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh nexus-backup:ci -ec '
            cd /app/apps/local-server/web/workstation
            test -s nexus-backup-workstation-windows-amd64.exe
            sha256sum -c nexus-backup-workstation-windows-amd64.exe.sha256
            test -s /usr/local/bin/sftpgo
            test -s /app/apps/local-server/bin/gateway.mjs
            ! find /app /usr/local/bin -maxdepth 4 -type f \( -iname "*restic*" -o -iname "*rest-server*" \) | grep .
          '
      - name: Verify image metadata and compose contract
        run: |
          set -euo pipefail
          test "$(docker image inspect nexus-backup:ci --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')" = 'Nexus Backup'
          docker compose config > /tmp/nexus-compose.yml
          grep -F 'network_mode: host' /tmp/nexus-compose.yml
          if grep -Eq 'SYS_ADMIN|/dev/fuse|privileged: true' /tmp/nexus-compose.yml; then exit 1; fi
      - name: Docker appliance protocol and lifecycle smoke test
        run: bash .github/scripts/test-flat-file-appliance.sh nexus-backup:ci
