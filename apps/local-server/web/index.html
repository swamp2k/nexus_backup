<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Nexus Backup</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/telemetry.css">
  <link rel="stylesheet" href="/plans.css">
  <link rel="stylesheet" href="/maintenance.css">
  <link rel="stylesheet" href="/repository-inventory.css">
  <link rel="stylesheet" href="/transfers.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 7.25A4.75 4.75 0 0 1 11.25 2.5h1.5a4.75 4.75 0 0 1 4.75 4.75v.6a4.5 4.5 0 0 1 2.5 4.03v1.37A4.75 4.75 0 0 1 15.25 18H15v1.25A2.75 2.75 0 0 1 12.25 22h-.5A2.75 2.75 0 0 1 9 19.25V18h-.25A4.75 4.75 0 0 1 4 13.25v-1.37a4.5 4.5 0 0 1 2.5-4.03v-.6Zm2 0v1.92l-.78.33A2.5 2.5 0 0 0 6 11.88v1.37A2.75 2.75 0 0 0 8.75 16h6.5A2.75 2.75 0 0 0 18 13.25v-1.37a2.5 2.5 0 0 0-1.72-2.38l-.78-.33V7.25a2.75 2.75 0 0 0-2.75-2.75h-1.5A2.75 2.75 0 0 0 8.5 7.25Zm2.5 10.75v1.25c0 .41.34.75.75.75h.5c.41 0 .75-.34.75-.75V18h-2Z"/></svg></div>
        <div><strong>Nexus Backup</strong><span>Local-first</span></div>
      </div>
      <nav class="nav" aria-label="Primary">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span><span>Overview</span></button>
        <button class="nav-item" data-view="jobs"><span class="nav-icon">↻</span><span>Jobs</span></button>
        <button class="nav-item" id="plans-nav"><span class="nav-icon">◷</span><span>Plans</span></button>
        <button class="nav-item" id="transfers-nav"><span class="nav-icon">⇄</span><span>Transfers</span></button>
        <button class="nav-item" data-view="sources"><span class="nav-icon">⇤</span><span>Sources</span></button>
        <button class="nav-item" data-view="destinations"><span class="nav-icon">⇥</span><span>Destinations</span></button>
        <button class="nav-item" data-view="repositories"><span class="nav-icon">▣</span><span>Repositories</span></button>
        <button class="nav-item" data-view="agent"><span class="nav-icon">◉</span><span>Agent</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
      </nav>
      <div class="sidebar-footer"><div class="connection-pill" id="connection-pill"><span class="status-dot"></span><span>Connecting…</span></div><span class="sidebar-note">No cloud dependency</span></div>
    </aside>
    <main class="main">
      <header class="topbar"><button class="icon-button mobile-only" id="menu-button" aria-label="Toggle menu">☰</button><div><p class="eyebrow" id="page-eyebrow">Nexus Backup</p><h1 id="page-title">Overview</h1></div><div class="topbar-actions"><button class="icon-button" id="theme-button" aria-label="Toggle theme">◐</button><button class="button ghost" id="refresh-button">Refresh</button><button class="button primary" id="new-job-button">New job</button></div></header>
      <section class="content" id="content" aria-live="polite"><div class="loading-card">Loading Nexus Backup…</div></section>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="modal-backdrop hidden" id="job-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="job-modal-title"><div class="modal-header"><div><p class="eyebrow">Queue work</p><h2 id="job-modal-title">New job</h2></div><button class="icon-button" data-close-modal aria-label="Close">×</button></div><form id="job-form"><label><span>Job type</span><select id="job-type" name="type"><option value="restic-backup">Local → Restic</option><option value="rclone-restic-backup">Remote mount → Restic</option><option value="rclone-transfer">Rclone copy</option></select></label><div id="job-fields"></div><label><span>Tags <small>optional, comma separated</small></span><input id="job-tags" autocomplete="off" placeholder="daily, appdata"></label><div class="modal-actions"><button type="button" class="button ghost" data-close-modal>Cancel</button><button type="submit" class="button primary">Queue job</button></div></form></section></div>
  <aside class="drawer" id="job-drawer" aria-hidden="true"><div class="drawer-header"><div><p class="eyebrow">Job detail</p><h2 id="drawer-title">Job</h2></div><button class="icon-button" id="drawer-close" aria-label="Close job details">×</button></div><div id="drawer-content" class="drawer-content"></div></aside>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <script type="module" src="/session.js"></script>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/telemetry.js"></script>
  <script type="module" src="/plans.js"></script>
  <script type="module" src="/maintenance.js"></script>
  <script type="module" src="/repository-inventory.js"></script>
  <script type="module" src="/transfers.js"></script>
  <script type="module">
    let gates=[];
    let rules=[];
    let editingId=null;
    const nativeFetch=window.fetch.bind(window);

    window.fetch=async(input,init={})=>{
      const url=typeof input==="string"?input:input?.url||"";
      const method=String(init.method||(typeof input!=="string"&&input?.method)||"GET").toUpperCase();
      const mutation=(method==="POST"&&/\/v1\/local\/transfers$/.test(url))||(method==="PUT"&&/\/v1\/local\/transfers\/[^/]+$/.test(url));
      if(mutation&&typeof init.body==="string"){
        try{
          const payload=JSON.parse(init.body);
          const select=document.querySelector('#transfer-form select[name="rtorrentGateId"]');
          if(select)payload.rtorrentGateId=select.value||null;
          init={...init,body:JSON.stringify(payload)};
        }catch{}
      }
      return nativeFetch(input,init);
    };

    async function refreshRtorrentConfig(){
      try{
        const [configResponse,rulesResponse]=await Promise.all([nativeFetch("/v1/local/config",{headers:{accept:"application/json"}}),nativeFetch("/v1/local/transfers",{headers:{accept:"application/json"}})]);
        if(configResponse.ok){const config=await configResponse.json();gates=config.rtorrentGates??[];}
        if(rulesResponse.ok){const data=await rulesResponse.json();rules=data.rules??[];}
      }catch{}
      enhance();
    }

    function enhance(){
      const form=document.querySelector("#transfer-form");
      if(form&&!form.querySelector('[name="rtorrentGateId"]')){
        const enabled=form.querySelector(".enabled-row");
        const label=document.createElement("label");
        label.className="full";
        label.innerHTML=`<span>rTorrent readiness <small>optional</small></span><select name="rtorrentGateId"><option value="">Stability window only</option>${gates.map(g=>`<option value="${escapeHtml(g.id)}">${escapeHtml(g.id)} · ${g.required?"required":"fallback allowed"}</option>`).join("")}</select><small>Only the gate ID is stored in the rule. RPC address and credentials stay local in agent config.</small>`;
        if(enabled)enabled.before(label);else form.querySelector(".transfer-form-grid")?.append(label);
      }
      const select=form?.querySelector('[name="rtorrentGateId"]');
      if(select){const rule=rules.find(item=>item.id===editingId);select.value=rule?.rtorrentGateId||"";}

      document.querySelectorAll('.transfer-card[data-rule]').forEach(card=>{
        const rule=rules.find(item=>item.id===card.dataset.rule);if(!rule)return;
        const filters=card.querySelector(".transfer-meta.filters");
        if(filters&&!filters.querySelector("[data-rtorrent-meta]")){
          const span=document.createElement("span");span.dataset.rtorrentMeta="1";span.textContent=rule.rtorrentGateId?`rTorrent: ${rule.rtorrentGateId}`:"rTorrent: off";filters.prepend(span);
        }
      });
      const note=document.querySelector("#transfers-view .transfer-note");
      if(note)note.innerHTML="<strong>Copyarr safety:</strong> staged transfer + exact-size verification are active. Move deletes source only after final verification. Cleanup re-checks destination provenance before delete. Optional rTorrent readiness gates hold back known incomplete torrents; credentials never leave local agent config.";
    }

    document.addEventListener("click",event=>{
      const edit=event.target.closest?.('[data-action="edit"][data-id]');
      if(edit){editingId=edit.dataset.id;queueMicrotask(enhance);setTimeout(enhance,0);}
      if(event.target.closest?.("#new-job-button")){editingId=null;queueMicrotask(enhance);setTimeout(enhance,0);}
    },true);
    new MutationObserver(enhance).observe(document.body,{childList:true,subtree:true});
    window.addEventListener("hashchange",()=>{if(location.hash==="#transfers")void refreshRtorrentConfig();});
    setInterval(()=>{if(location.hash==="#transfers")void refreshRtorrentConfig();},5000);
    if(location.hash==="#transfers")void refreshRtorrentConfig();
    function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));}
  </script>
</body>
</html>
