<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Nexus Backup</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/transfers.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 7.25A4.75 4.75 0 0 1 11.25 2.5h1.5a4.75 4.75 0 0 1 4.75 4.75v.6a4.5 4.5 0 0 1 2.5 4.03v1.37A4.75 4.75 0 0 1 15.25 18H15v1.25A2.75 2.75 0 0 1 12.25 22h-.5A2.75 2.75 0 0 1 9 19.25V18h-.25A4.75 4.75 0 0 1 4 13.25v-1.37a4.5 4.5 0 0 1 2.5-4.03v-.6Zm2 0v1.92l-.78.33A2.5 2.5 0 0 0 6 11.88v1.37A2.75 2.75 0 0 0 8.75 16h6.5A2.75 2.75 0 0 0 18 13.25v-1.37a2.5 2.5 0 0 0-1.72-2.38l-.78-.33V7.25a2.75 2.75 0 0 0-2.75-2.75h-1.5A2.75 2.75 0 0 0 8.5 7.25Zm2.5 10.75v1.25c0 .41.34.75.75.75h.5c.41 0 .75-.34.75-.75V18h-2Z"/></svg></div><div><strong>Nexus Backup</strong><span>Local-first</span></div></div>
      <nav class="nav" aria-label="Primary">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span><span>Overview</span></button>
        <button class="nav-item" data-view="jobs"><span class="nav-icon">↻</span><span>Jobs</span></button>
        <button class="nav-item" id="transfers-nav"><span class="nav-icon">⇄</span><span>Transfers</span></button>
        <button class="nav-item" data-view="sources"><span class="nav-icon">⇤</span><span>Sources</span></button>
        <button class="nav-item" data-view="destinations"><span class="nav-icon">⇥</span><span>Destinations</span></button>
        <button class="nav-item" data-view="repositories"><span class="nav-icon">▣</span><span>Repositories</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
      </nav>
      <div class="sidebar-footer"><div class="connection-pill" id="connection-pill"><span class="status-dot"></span><span>Connecting…</span></div><span class="sidebar-note">No cloud dependency</span></div>
    </aside>
    <main class="main">
      <header class="topbar"><button class="icon-button mobile-only" id="menu-button" aria-label="Toggle menu">☰</button><div><p class="eyebrow" id="page-eyebrow">Nexus Backup</p><h1 id="page-title">Overview</h1></div><div class="topbar-actions"><button class="icon-button" id="theme-button" aria-label="Toggle theme">◐</button><button class="button ghost" id="refresh-button">Refresh</button><button class="button primary" id="new-job-button">New transfer</button></div></header>
      <section class="content" id="content" aria-live="polite"><div class="loading-card">Loading Nexus Backup…</div></section>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="modal-backdrop hidden" id="job-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="job-modal-title"><div class="modal-header"><div><p class="eyebrow">Queue work</p><h2 id="job-modal-title">New transfer</h2></div><button class="icon-button" data-close-modal aria-label="Close">×</button></div><form id="job-form"><div id="job-fields"></div><div class="modal-actions"><button type="button" class="button ghost" data-close-modal>Cancel</button><button type="submit" class="button primary">Queue transfer</button></div></form></section></div>
  <aside class="drawer" id="job-drawer" aria-hidden="true"><div class="drawer-header"><div><p class="eyebrow">Job detail</p><h2 id="drawer-title">Job</h2></div><button class="icon-button" id="drawer-close" aria-label="Close job details">×</button></div><div id="drawer-content" class="drawer-content"></div></aside>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <script type="module" src="/session.js"></script>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/remote-connection.js"></script>
  <script type="module" src="/transfers.js"></script>
  <script type="module" src="/repositories.js"></script>
  <script type="module" src="/maintenance.js"></script>
  <script type="module">
    const content = document.querySelector("#content");
    const nativeFetch = window.fetch.bind(window);
    let gates = [];
    let rules = [];
    let editingId = null;
    async function refreshRtorrentConfig() {
      try {
        const [configResponse, rulesResponse] = await Promise.all([nativeFetch("/v1/local/config"), nativeFetch("/v1/local/transfers")]);
        if (configResponse.ok) gates = (await configResponse.json()).rtorrentGates ?? [];
        if (rulesResponse.ok) rules = (await rulesResponse.json()).rules ?? [];
      } catch {}
      enhance();
    }
    function enhance() {
      const form = document.querySelector("#transfer-form");
      if (form && !form.querySelector('[name="rtorrentGateId"]')) {
        const label = document.createElement("label");
        label.className = "full";
        label.innerHTML = `<span>rTorrent readiness <small>optional</small></span><select name="rtorrentGateId"><option value="">Stability window only</option>${gates.map((gate) => `<option value="${escapeHtml(gate.id)}">${escapeHtml(gate.id)} · ${gate.required ? "required" : "fallback allowed"}</option>`).join("")}</select><small>Only the gate ID is stored. RPC addresses and credentials remain local to the appliance.</small>`;
        form.querySelector(".enabled-row")?.before(label);
      }
      const select = form?.querySelector('[name="rtorrentGateId"]');
      if (select) select.value = rules.find((rule) => rule.id === editingId)?.rtorrentGateId || "";
      const note = document.querySelector("#transfers-view .transfer-note");
      if (note && note.innerHTML !== "<strong>Copyarr safety:</strong> staged transfer, exact-size verification, source protection and optional rTorrent readiness gating are active.") note.innerHTML = "<strong>Copyarr safety:</strong> staged transfer, exact-size verification, source protection and optional rTorrent readiness gating are active.";
    }
    const originalFetch = window.fetch.bind(window);
    window.fetch = async (input, init = {}) => {
      const url = new URL(typeof input === "string" || input instanceof URL ? input : input.url, location.href);
      const method = String(init.method || (input instanceof Request ? input.method : "GET") || "GET").toUpperCase();
      if (url.pathname === "/v1/local/transfers" && method === "POST" && typeof init.body === "string") {
        try {
          const payload = JSON.parse(init.body);
          const select = document.querySelector('#transfer-form [name="rtorrentGateId"]');
          if (select) init = { ...init, body: JSON.stringify({ ...payload, rtorrentGateId: select.value || null }) };
        } catch {}
      }
      return originalFetch(input, init);
    };
    document.addEventListener("click", (event) => {
      const edit = event.target.closest?.('[data-action="edit"][data-id]');
      if (edit) { editingId = edit.dataset.id; queueMicrotask(enhance); }
      if (event.target.closest?.("#new-job-button")) { editingId = null; queueMicrotask(enhance); }
    }, true);
    new MutationObserver(enhance).observe(content, { childList: true, subtree: true });
    window.addEventListener("hashchange", () => { if (location.hash === "#transfers") void refreshRtorrentConfig(); });
    setInterval(() => { if (location.hash === "#transfers") void refreshRtorrentConfig(); }, 5000);
    if (location.hash === "#transfers") void refreshRtorrentConfig();
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char])); }
  </script>
</body>
</html>
